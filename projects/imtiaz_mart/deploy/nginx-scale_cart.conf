# Nginx: reverse proxy + load balancer + static file server for Scale Cart.
# Install: sudo cp nginx-scale_cart.conf /etc/nginx/sites-available/scale_cart
#          sudo ln -s /etc/nginx/sites-available/scale_cart /etc/nginx/sites-enabled/
#
#   browser ──▶ Nginx :80 ──┬── /api/*  ──▶ upstream (3 Node processes, load balanced)
#                           └── else    ──▶ React build in /var/www/scale_cart

# The pool of API processes. Nginx picks one per request.
upstream scalecart_api {
    # least_conn: send to the process with the fewest open requests.
    # Better than plain round-robin here because requests differ a lot in cost
    # (a login spends ~100 ms hashing; a cached product page is a few ms).
    # When all are equally idle, it falls back to round-robin.
    least_conn;

    # max_fails/fail_timeout: 2 failures in 10 s -> skip that process for 10 s (passive health check)
    server 127.0.0.1:4001 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:4002 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:4003 max_fails=2 fail_timeout=10s;

    # Reuse TCP connections to Node instead of opening one per request
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;   # later: your domain, e.g. scalecart.com

    server_tokens off;            # don't advertise the Nginx version
    client_max_body_size 16k;     # our biggest body (an order) is a few KB

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---------- API: reverse proxy to the pool ----------
    location /api/ {
        proxy_pass http://scalecart_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";                 # needed for keepalive above
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # Node reads the client IP (TRUST_PROXY=1)
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 2s;     # a process that won't accept in 2 s is treated as down
        proxy_read_timeout 30s;       # matches Node's requestTimeout
        # If a process is down, retry the request on another one (GETs; a POST only if it
        # never reached Node, so an order can't be sent twice)
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;

        # Learning aid: which process answered. Remove before real launch (leaks internal ports).
        add_header X-Upstream $upstream_addr always;
    }

    # ---------- React build ----------
    root /var/www/scale_cart;
    index index.html;

    # Vite file names contain a content hash (index-3f2a1c.js): safe to cache for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Every other path is a React route (/collections/shoes, /checkout...): serve index.html.
    # no-cache: the browser re-checks index.html each visit, so a new deploy shows up at once.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
